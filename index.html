e-block;background:#e3eee4;padding:5px 9px;border-radius:8px;margin-bottom:9px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid button{width:100%}.stack{display:grid;gap:8px}.wide{width:100%;margin-top:10px}.metric{background:#f6f7f3;border-radius:14px;padding:13px;min-width:0}.metric strong{display:block;font-size:24px;line-height:1.2;letter-spacing:-.04em}.metric small{font-size:12px}.bar{height:9px;border-radius:20px;background:#dce7dc;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;background:#347c5f;border-radius:20px;transition:width .2s}.dogs{display:flex;gap:7px;margin-bottom:14px}.dogs button{flex:1;padding:10px 6px;background:#e4e9e0;color:#3e5147;font-size:14px}.dogs button.active{background:#21634e;color:#fff}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:flex;justify-content:center;z-index:10}.bottom button{background:transparent;color:#65766c;flex:1;max-width:155px;display:grid;justify-items:center;gap:1px;font-size:11px;padding:5px 2px;min-height:52px;border-radius:12px}.bottom button b{font-size:22px;line-height:1.1;font-weight:400}.bottom button.active{background:#e7f0e5;color:#1d5c46}.lesson{display:flex;gap:10px;align-items:center;width:100%;text-align:left;color:var(--ink);background:#fff;border:1px solid var(--line);padding:12px;margin:7px 0}.lesson .num{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:var(--light);color:var(--green)}.lesson span:nth-child(2){flex:1;min-width:0}.lesson small{display:block;font-weight:400}.steps{padding-left:23px;margin:10px 0}.steps li{padding-left:3px;margin:9px 0}.item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item input{width:23px;height:23px;accent-color:var(--green);flex:none;margin:1px 0}.item label{flex:1}.item label small{display:block}.field{margin:13px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid #bccdc0;border-radius:11px;color:var(--ink);background:white;font-size:16px}.history{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0}.history span{min-width:0}.history button{padding:6px 10px;min-height:42px}.clock{font-size:46px;font-variant-numeric:tabular-nums;letter-spacing:-.04em;font-weight:800;text-align:center;margin:8px 0}.note{font-size:13px;color:var(--muted)}a{color:#17654c}details{padding:9px 0}summary{cursor:pointer;font-weight:700}.notice{padding:10px;border-radius:10px;background:#fff2d7;margin-bottom:12px}#toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#172d26;color:white;padding:11px 18px;border-radius:14px;z-index:20;max-width:90vw;box-shadow:0 4px 15px #0002;font-size:14px;display:none}button[aria-current=true]{background:var(--green);color:white}.tiny{font-size:12px} @media(min-width:600px){main{padding-top:23px}.card{padding:22px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div class="wrap"><div class="brand"><span class="mark">🐾</span> PAW SCHOOL <span style="margin-left:auto;font-size:11px;color:#a8cbb1">2.0</span></div><h1 id="headline">Good dogs, good days.</h1><p id="subtitle">A little practice every day goes a long way.</p></div></header><main><div id="app"></div></main><nav class="bottom" aria-label="Main navigation" id="nav"></nav><div id="toast" role="status" aria-live="polite"></div><script>
'use strict';
const L=(id,title,priority,time,steps,ready,fix)=>({id,title,priority,time,steps,ready,fix});
const lessons={b:[
L('b-name','Name & focus','Start here',3,['In a quiet room, say Betty’s name once.','When she looks at you, say “yes” and reward immediately.','Repeat 5 times, then try with a tiny distraction.'], 'Looks at you 4 out of 5 times in a quiet room on two days.','Move somewhere quieter and use a reward she likes. Don’t repeat her name.'),
L('b-bell','Touch the potty bell','Essential',3,['Hang the bell at nose height, away from swinging doors.','Reward looking at it, then a gentle nose touch.','Reward a soft ring; if the sound scares her, muffle it and start farther away.'], 'Willingly rings 4 out of 5 tries on two days.', 'Reward smaller steps; never press her nose or paw into the bell.'),
L('b-bellout','Bell means outside','Essential',3,['Before each regular potty trip, ask for a bell touch.','Open the door immediately after a ring and go to the usual potty spot.','Reward outdoor pee or poop right away. If urgent, skip the bell and go out.'], 'Rings before most trips with a small cue for several days.', 'Use the same door and cue; keep potty trips calm and predictable.'),
L('b-bellsolo','Ring without help','Essential',3,['Before opening the door, give Betty a few seconds to offer a ring.','If she rings, immediately take her out; otherwise prompt once.','Respond to independent rings; make non-potty trips brief and boring.'], 'Several unprompted rings followed by potty on different days; continue routine breaks.', 'Return to the cue stage if she stops ringing; never make her wait urgently.'),
L('b-sit','Sit','Foundation',3,['Hold a treat near her nose and move it slightly upward and back.','When her bottom touches the floor, mark “yes” and reward.','Fade the lure, say “sit” once, then reward the response.'], 'Sits on one cue 4 out of 5 times on two days.', 'Use a non-slip surface; do not push her hips down.'),
L('b-come','Come when called','Essential',3,['Start a few steps away indoors. Say “Betty, come!” in a cheerful voice.','Reward generously when she reaches you; gently touch her collar if comfortable.','Practice between two people or in a fenced area. Never call her to punish her.'], 'Returns promptly 4 out of 5 times in a safe, low-distraction area.', 'Shorten the distance; use a secure leash outdoors. Do not test off-leash near roads.'),
L('b-wait','Wait at doors','Essential',3,['Start at a closed door on leash or with a barrier.','Say “wait”, open the door a crack, and reward staying back.','Close gently if she moves forward; gradually open farther and release with “okay”.'], 'Waits briefly with door open, then moves on release, 4 out of 5 times.', 'Use smaller door openings; a physical barrier remains important.'),
L('b-place','Place / settle on bed','Essential',4,['Place a mat in a quiet area. Reward stepping onto it.','Reward lying down or relaxed standing on the mat.','Say “place” once, then gradually reward calm stays for a few seconds longer. Release before she gets restless.'], 'Goes to mat on cue and relaxes for 30–60 seconds with rewards.', 'Shorten duration and move the mat away from distractions.'),
L('b-leave','Leave it','Essential',3,['Hold a treat in a closed fist. Wait for Betty to stop investigating.','Mark the moment she turns away; reward with a different treat.','Add “leave it” before showing the fist, then practice with a covered item on the floor.'], 'Turns away from a covered item 4 out of 5 times.', 'Make it easier; never practice with harmful objects or force her mouth open.'),
L('b-drop','Drop it / trade','Essential',3,['Give a low-value toy. Offer a tasty trade.','When she releases, mark and reward. Give the toy back when safe.','Add “drop” before the trade; practice with easy objects.'], 'Releases an ordinary toy willingly 4 out of 5 times.', 'Do not grab or chase her. If she guards objects, separate and seek reward-based professional help.'),
L('b-leash','Loose-leash walking','Helpful',4,['In a quiet area, reward Betty for walking near you on a loose leash.','When the leash tightens, stop calmly and reward when she returns.','Build up short, easy walks; let her sniff as a reward.'], 'Can take a short walk with a mostly loose leash in a quiet area.', 'Decrease distractions and reward more often; use a comfortable harness.'),
L('b-handling','Comfort with handling','Helpful',3,['Briefly touch a shoulder, reward, then stop.','Gradually practice paws, ears and collar with permission and rewards.','Let Betty move away whenever she wants.'], 'Remains relaxed during a few gentle touches.', 'Stop if she avoids, freezes or growls. Ask a vet about pain.'),
L('b-calm','Calm around distractions','Essential',4,['Set up a gate and reward Betty for relaxing on her bed.','Practice with a family member moving or quiet puppy sounds at low volume.','Keep distance and reward calm attention; end before she gets overwhelmed.'], 'Can relax and respond to her name near a mild distraction.', 'Increase distance and lower the noise. Do not flood her with stimulation.'),
L('b-alone','Rest behind a gate','Essential',3,['Give Betty a comfortable separate room or bed with water.','Reward calm moments behind a gate while you remain nearby.','Practice short separations and return before distress.'], 'Comfortably rests apart from you for short periods.', 'Make separations shorter; never force prolonged confinement.'),
L('b-review','December readiness review','Review',4,['Practice name, come, wait, place, leave it and drop in separate short sessions.','Review independent bell rings and keep normal potty trips.','Set up separate beds, bowls and gated spaces before pickup.'], 'Core skills are improving and the home is ready. Unfinished skills can continue after arrival.', 'Prioritize safety management over a deadline; ask a qualified trainer about reactivity or guarding.')],
p:[
L('p-settle','First day: settle in','8 weeks',2,['Show the puppy a quiet, warm sleeping area and a safe potty spot.','Keep visitors and play low-key. Offer water and breeder-recommended meals.','Stay close, allow frequent naps and learn the puppy’s body language.'], 'Puppy is eating, drinking and able to rest; discuss any concerns with the vet.', 'If the puppy is weak, vomiting, refusing food or unusually sleepy, contact a vet promptly; tiny puppies can become ill quickly.'),
L('p-potty','Potty routine','8 weeks',2,['Take the puppy out after waking, meals, drinking and play; also frequently while awake.','Reward outdoor potty immediately. Keep a supervised indoor area.','If no potty, return to supervision and try again shortly. Clean accidents with enzymatic cleaner; never punish.'], 'Outdoor potty is becoming frequent; continue scheduled breaks regardless of accidents.', 'Start with breaks about every 30–60 minutes while awake and adjust to the puppy. Night breaks may be needed.'),
L('p-name','Name & attention','8 weeks',2,['Say the puppy’s name once when nearby.','Mark and reward looking at you.','Do 3–5 easy repetitions and finish before the puppy gets tired.'], 'Looks toward you most times in a quiet room.', 'Reduce noise and reward small head turns.'),
L('p-crate','Crate / pen comfort','8 weeks',2,['Place a comfortable crate or pen in a quiet area. Leave the crate door open.','Reward voluntary entry and offer meals or safe toys inside.','Build very short door-closed moments while you stay close; release before distress.'], 'Enters willingly and can rest comfortably for a short time.', 'Make it easier. Never use a crate as punishment or for long stretches beyond potty needs.'),
L('p-bell','Gentle bell touch','8–10 weeks',2,['Reward looking at the bell and voluntary nose touches.','Keep the sound soft and let the puppy move away.','Let the puppy watch Betty if both are comfortable, but practice individually.'], 'Touches or rings willingly without fear.', 'Keep the regular potty schedule. A young puppy is not ready to rely on the bell alone.'),
L('p-bellout','Bell before potty','8–12 weeks',2,['Prompt a gentle bell touch before a routine potty trip.','Open the door immediately and reward outdoor potty.','If puppy needs to go now, skip the bell and take them out.'], 'Often touches the bell with a cue before trips.', 'Continue predictable breaks; never delay potty to practice a trick.'),
L('p-sit','Sit','8–12 weeks',2,['Lure a sit with a tiny treat near the nose, moving slightly up.','Mark and reward when the bottom touches the ground.','Gradually use an empty hand and add the word “sit”.'], 'Responds to a simple cue in a quiet room.', 'Keep sessions very short; avoid pushing or holding the puppy in position.'),
L('p-come','Come','8–12 weeks',2,['Call the puppy cheerfully from a few steps away.','Reward reaching you with food, play or praise.','Practice in a safe enclosed room; never chase the puppy.'], 'Comes readily over short distances indoors.', 'Use a shorter distance and better rewards. Use leash or fence outside.'),
L('p-social','Safe socialization','8–16 weeks',2,['Introduce calm people, household sounds and surfaces at a comfortable distance.','Reward curiosity and let the puppy choose whether to approach.','Ask your vet about local infection risk and safe contact with healthy, vaccinated dogs; avoid dog parks and unknown dog waste.'], 'Puppy has brief positive experiences without fear; continue throughout life.', 'Stop if fearful. Increase distance, reduce intensity and seek vet guidance if fear persists.'),
L('p-bite','Puppy biting & chewing','8–16 weeks',2,['Keep safe chew toys nearby. Redirect teeth from hands to a toy.','If play gets too rough, calmly pause and give space.','Check whether the puppy needs sleep, food, a potty break or a quieter activity.'], 'Can redirect to an appropriate toy more often.', 'Never hit, shout or hold the muzzle. Prevent access to cords and small objects.'),
L('p-handle','Gentle handling & grooming','8–16 weeks',2,['Touch a shoulder briefly, reward and stop.','Introduce a soft brush, paws, ears and collar in tiny steps.','Pair each comfortable touch with a treat; allow choice.'], 'Comfortable with brief brushing and touch.', 'Stop if the puppy pulls away. Ask a groomer or vet how to care for the coat.'),
L('p-leave','Leave it & trade','10–16 weeks',2,['Reward turning away from a closed hand holding a treat.','Trade a low-value toy for a tasty reward; return it when safe.','Add cues only once the behaviors are easy.'], 'Can turn away and trade a toy without stress.', 'Avoid chasing or taking items by force; manage the environment.'),
L('p-leash','Harness & leash introduction','8–16 weeks',2,['Let the puppy sniff the harness and reward.','Practice putting it on briefly without forcing.','Take a few rewarded steps indoors; ask the vet about safe outdoor walks.'], 'Comfortably wears the harness and follows for a few steps.', 'Stop if afraid; choose a properly fitted lightweight harness.'),
L('p-alone','Short alone-time practice','8–16 weeks',2,['Set up a safe pen with a comfortable bed and water.','Start with seconds apart while puppy is calm and awake.','Gradually increase only when relaxed; plan for potty and human company.'], 'Can stay calm briefly while you step away.', 'Return before distress; if separation problems persist, get professional help.'),
L('p-solo','Independent potty signals','Ongoing',2,['Pause briefly at the door to let the puppy offer a ring.','Immediately respond to voluntary rings and reward outdoor potty.','Keep scheduled trips until reliable over time; log accidents without punishment.'], 'Repeated reliable signals across days and fewer accidents; reliability can take months.', 'Increase regular potty breaks if accidents recur. Ask a vet about sudden changes.')],
t:[
L('t-prep','Prepare separate spaces','Before arrival',3,['Set up a gate or pen, two beds, separate feeding stations and water.','Put high-value toys and chews away before meetings.','Plan an adult helper for introductions and give Betty her regular one-on-one time.'], 'Both dogs have separate safe spaces; family agrees on supervision.', 'Do not leave a tiny puppy alone with Betty, even if she seems friendly.'),
L('t-meet','First meeting','Arrival day',3,['Choose a quiet, clean, private space approved by the vet for the puppy. Have one adult manage each dog.','Allow relaxed distance and brief sniffing only if both choose it. Reward calm behavior.','Separate before either gets tired. Do not force greetings or hold the puppy up to Betty’s face.'], 'Both dogs can stay loose-bodied and disengage comfortably.', 'Separate if stiff, staring, growling, hiding or chasing. Seek a qualified trainer if repeated.'),
L('t-gate','Relax on opposite sides of a gate','First week',3,['Use a secure gate with space on both sides; supervise.','Reward each dog for noticing the other and relaxing.','Keep sessions short and give both dogs rest away from each other.'], 'Both can settle without barking, lunging or fixating.', 'Increase distance, block the view if needed, and shorten sessions.'),
L('t-turn','Take turns training','First weeks',3,['One person trains Betty while the puppy rests separately.','Swap and practice the puppy’s easy cues.','Later reward calm waiting behind a gate while the other dog practices.'], 'Both dogs can practice without crowding or stealing rewards.', 'Keep food rewards separate; avoid competition.'),
L('t-bell','Watch Betty ring the bell','First weeks',2,['Take Betty to the door and let her ring.','Let the puppy observe from a safe distance with another adult or behind a gate.','Give the puppy separate bell practice and independent potty rewards.'], 'Both are comfortable with the bell and potty routine.', 'The puppy may not copy Betty. Keep individual training and frequent potty trips.'),
L('t-play','Supervised gentle play','Ongoing',3,['Allow brief play only when both dogs are loose and interested.','Pause often; reward disengaging and give breaks.','Protect the small puppy from body slams, chasing or rough size-mismatched play.'], 'Both dogs choose to re-engage after breaks and can disengage.', 'Separate immediately if one cannot escape or looks worried. No unsupervised play.'),
L('t-routine','Build a shared routine','Ongoing',3,['Feed separately and remove food bowls after meals as appropriate; keep fresh water available.','Keep Betty’s walks and attention, plus separate puppy naps and potty breaks.','Review both dogs’ progress weekly and continue individual skills.'], 'Both dogs can rest, eat and train without conflict.', 'If guarding, snapping or repeated fear occurs, use separation and contact a vet or qualified behavior professional.')]
};
const prep=[['spaces','Separate beds, gate or secure pen','Give each dog an escape and a quiet place to sleep.'],['food','Separate feeding areas and water bowls','No shared high-value chews or food during early introductions.'],['vet','Book puppy vet visit','Confirm vaccination, parasite prevention, local infection risk and feeding plan.'],['proof','Puppy-proof home','Block cords, toxic plants, medicines, small objects and stairs.'],['supplies','Potty bell, harness, leash, cleaner and tiny treats','Choose puppy-safe sizes and a non-slip potty route.'],['winter','Plan for Alberta winter','Clear a safe potty spot, keep trips short in extreme cold and dry paws.'],['family','Agree on rules with family','Use the same cues, supervise together and keep a daily potty routine.'],['intro','Plan introduction with an adult helper','Separate food, toys and rest; no unsupervised time together.']];
const supplies=['Secure baby gate or puppy pen','Comfortable beds / crate','Separate bowls and fresh water','Puppy food recommended by breeder / vet','Small training treats or kibble','Properly fitted harness and leash','Potty bell and enzymatic cleaner','Puppy-safe chew toys and brush','Vet appointment and records'];
const defaults=()=>({v:2,dog:'b',tab:'today',arrival:'2026-12-01',name:'New puppy',start:'2026-11-15',done:{},logs:[],check:{},supply:{},focus:{},notes:'',arrived:false});
let state=defaults(), storageOK=true, storageMsg='';try{let raw=localStorage.getItem('pawschool-v2');if(raw){state=normalize(JSON.parse(raw))}else{let old=JSON.parse(localStorage.getItem('pawschool-v1')||'null');if(old){state.arrival=old.arrival||state.arrival;state.name=old.name||state.name;storageMsg='Previous puppy name and arrival date imported. New lessons have their own milestones.'}}}catch(e){storageOK=false}function normalize(s){if(!s||s.v!==2||!Array.isArray(s.logs)||!s.done||typeof s.done!=='object')throw Error('Not a Paw School 2 backup');let d=defaults();return {...d,...s,dog:['b','p','t'].includes(s.dog)?s.dog:'b',tab:['today','train','potty','progress','more'].includes(s.tab)?s.tab:'today',logs:s.logs.filter(x=>x&&typeof x.id==='string'&&/^[a-z0-9-]{1,80}$/.test(x.id)&&typeof x.time==='number'&&Number.isFinite(x.time)&&Math.abs(x.time)<8640000000000000&&['b','p','t'].includes(x.dog)).slice(0,10000),check:s.check||{},supply:s.supply||{},focus:s.focus||{},done:s.done||{},arrival:/^\d{4}-\d{2}-\d{2}$/.test(s.arrival)?s.arrival:d.arrival,name:String(s.name||d.name).slice(0,40),notes:String(s.notes||'').slice(0,5000)}}
function save(){try{localStorage.setItem('pawschool-v2',JSON.stringify(state));storageOK=true}catch(e){storageOK=false}}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=x=>document.getElementById(x);const name=d=>d==='b'?'Betty':d==='p'?state.name:'Both dogs';const fmt=t=>new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});const today=t=>new Date(t).toDateString()===new Date().toDateString();const days=()=>Math.max(0,Math.round((new Date(state.arrival+'T00:00:00')-new Date(new Date().setHours(0,0,0,0)))/86400000));const cnt=d=>lessons[d].filter(l=>state.done[l.id]).length;const first=d=>lessons[d].find(l=>!state.done[l.id])||lessons[d][0];const selected=d=>lessons[d].find(l=>l.id===state.focus[d])||first(d);let timerEnd=0,timerRemaining=0,timerTick=null,toastTimer;function notify(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2400)}function go(tab){state.tab=tab;save();render();window.scrollTo(0,0)}function dog(d){state.dog=d;save();render()}function openLesson(id){state.focus[state.dog]=id;go('train')}function add(kind,lesson='',d=state.dog){state.logs.unshift({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),dog:d,kind,lesson,time:Date.now()});save();render();notify('Saved: '+kind)}function toggleDone(id){state.done[id]=!state.done[id];save();render();notify(state.done[id]?'Milestone completed!':'Milestone reopened')}function toggleCheck(group,id){state[group][id]=!state[group][id];save();render()}function removeLog(id){if(!confirm('Delete this log?'))return;state.logs=state.logs.filter(l=>l.id!==id);save();render()}function setField(k,v){state[k]=v;save();render()}function clockText(){let s=timerEnd?Math.max(0,Math.ceil((timerEnd-Date.now())/1000)):timerRemaining;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function updateClock(){if($('clock'))$('clock').textContent=clockText();if(timerEnd&&Date.now()>=timerEnd){timerEnd=0;timerRemaining=0;clearInterval(timerTick);timerTick=null;notify('Session finished! Reward and give your dog a break.');if($('clock'))$('clock').textContent='00:00';if($('timerstatus'))$('timerstatus').textContent='Finished — time for a break.';}}function startTimer(min){timerRemaining=min*60;timerEnd=Date.now()+timerRemaining*1000;clearInterval(timerTick);timerTick=setInterval(updateClock,250);updateClock();if($('timerstatus'))$('timerstatus').textContent='Running while this page is open.'}function stopTimer(){timerRemaining=0;timerEnd=0;clearInterval(timerTick);timerTick=null;updateClock();if($('timerstatus'))$('timerstatus').textContent='Timer reset.'}
function dogs(){return `<div class="dogs" aria-label="Dog profile">${[['b','🐕 Betty'],['p','🐶 '+esc(state.name)],['t','🐾 Together']].map(([d,n])=>`<button class="${state.dog===d?'active':''}" aria-pressed="${state.dog===d}" onclick="dog('${d}')">${n}</button>`).join('')}</div>`}function progress(d){let n=cnt(d),total=lessons[d].length;return `<div class="bar" role="progressbar" aria-valuenow="${n}" aria-valuemax="${total}"><span style="width:${n/total*100}%"></span></div><small>${n} of ${total} milestones met · ${Math.round(n/total*100)}%</small>`}function metric(label,value){return `<div class="metric"><strong>${esc(value)}</strong><small>${esc(label)}</small></div>`}function section(title,body,cls=''){return `<section class="card ${cls}"><h2>${title}</h2>${body}</section>`}function history(list){return list.length?list.map(l=>`<div class="history"><span><strong>${esc(l.kind)}</strong><br><small>${esc(name(l.dog))} · ${esc(fmt(l.time))}${l.lesson?' · '+esc(l.lesson):''}</small></span><button class="outline" aria-label="Delete log" onclick="removeLog('${esc(l.id).replace(/&#39;/g,'')}')">✕</button></div>`).join(''):'<p class="muted">No activity logged yet.</p>'}function buttonLog(k,d){return `<button class="${k==='Accident'?'soft':''}" onclick="add('${k}','','${d}')">${k}</button>`}const pottyKinds=['Outside pee','Outside poop','Independent bell','Prompted bell','Accident','No potty'];
function todayView(){let d=state.dog,l=first(d),pc=state.logs.filter(x=>x.dog===d&&today(x.time));let until=days();let out=dogs();out+=section(d==='b'?'Betty’s December mission':d==='p'?esc(state.name)+'’s first weeks':'Two dogs, one happy home',`<span class="tag">${d==='b'?'Almost 5 · adult':d==='p'?'Micro mini Bernedoodle':'Supervised only'}</span><p>${d==='b'?(until?`<strong>${until} days</strong> until the selected pickup date. Focus on progress, not perfection.`:'Pickup date has arrived or passed. Keep training at Betty’s pace.'):d==='p'?'Begin at arrival, around 8 weeks old. Keep sessions short and potty trips frequent.':'Build calm interactions. Give each dog a separate place to rest.'}</p>${progress(d)}<div class="grid" style="margin-top:14px">${metric('Sessions today',pc.filter(x=>x.kind==='Practice went well'||x.kind==='Needs practice').length)}${metric('Potty successes today',pc.filter(x=>x.kind==='Outside pee'||x.kind==='Outside poop').length)}</div>`,'hero');out+=section('Your next lesson',`<span class="tag">${esc(l.priority)} · ${l.time} min</span><h3>${esc(l.title)}</h3><p>${esc(l.steps[0])}</p><button class="wide" onclick="openLesson('${l.id}')">Start lesson</button>`);if(d==='b'){let phase=until>10?'Build the basics':until>4?'Practice with distractions':'Prepare the home & review';out+=section('Preparation plan',`<p><strong>${phase}</strong></p><div class="item"><span>01</span><div><strong>First 4–5 days</strong><p class="muted">Name, bell, sit and come. Practice bell on every normal potty trip.</p></div></div><div class="item"><span>02</span><div><strong>Next week</strong><p class="muted">Wait, place, leave it and drop it. Keep practicing the earlier skills.</p></div></div><div class="item"><span>03</span><div><strong>Before pickup</strong><p class="muted">Calm behind gates, independent bell and setup for the puppy. Repeat skills instead of rushing.</p></div></div><button class="wide soft" onclick="go('more')">Open arrival checklist</button>`)}if(d==='p')out+=section('Daily puppy rhythm',`<p><strong>Wake → potty → meal → potty → short play/training → potty → nap.</strong></p><p>Offer breaks often while awake (start around every 30–60 minutes), after meals, play and naps, and overnight as needed. Ask your vet about meals for a tiny puppy.</p><p class="muted">Bell training is extra; don’t wait for a signal. Keep outdoor visits safe and warm.</p>`);if(d==='t')out+=section('Safety first','<p>Use gates, separate meals and supervise every interaction. Give Betty time alone and protect the little puppy from rough play. If either dog is tense or fearful, separate them.</p>','warn');return out+section('Today’s activity',history(pc.slice(0,5)))}
function trainView(){let d=state.dog,l=selected(d),good=state.logs.filter(x=>x.lesson===l.title&&x.dog===d&&x.kind==='Practice went well').length,not=state.logs.filter(x=>x.lesson===l.title&&x.dog===d&&x.kind==='Needs practice').length;return dogs()+section('Training coach',`<span class="tag">${esc(l.priority)} · ${l.time} min</span><h3>${esc(l.title)}</h3><ol class="steps">${l.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="notice"><strong>Ready to move on when</strong><p>${esc(l.ready)}</p></div><details><summary>What if it isn’t working?</summary><p>${esc(l.fix)}</p></details><div class="clock" id="clock">${clockText()}</div><p id="timerstatus" class="note" style="text-align:center">${timerEnd?'Running while this page is open.':'Optional short session timer'}</p><div class="grid"><button class="soft" onclick="startTimer(${l.time})">Start ${l.time} min</button><button class="outline" onclick="stopTimer()">Reset timer</button></div><div class="grid" style="margin-top:10px"><button onclick="logLesson('Practice went well')">✓ Went well</button><button class="soft" onclick="logLesson('Needs practice')">Needs practice</button></div><p class="note">${good} good sessions · ${not} sessions needing practice</p><button class="wide ${state.done[l.id]?'outline':''}" onclick="toggleDone('${l.id}')">${state.done[l.id]?'✓ Milestone met — reopen':'Mark milestone met'}</button><button class="wide soft" onclick="nextLesson()">Next lesson →</button><p class="note">Mark complete only when the readiness goal is met. You can revisit any skill.</p>`)+section('All lessons',lessons[d].map((x,i)=>`<button class="lesson" onclick="openLesson('${x.id}')"><span class="num">${state.done[x.id]?'✓':i+1}</span><span>${esc(x.title)}<small>${esc(x.priority)} · ${x.time} min</small></span><span>›</span></button>`).join(''))}function logLesson(k){add(k,selected(state.dog).title)}function nextLesson(){let d=state.dog,i=lessons[d].indexOf(selected(d));state.focus[d]=lessons[d][Math.min(i+1,lessons[d].length-1)].id;save();render();window.scrollTo(0,0)}
function pottyView(){let d=state.dog==='t'?'b':state.dog,log=state.logs.filter(x=>x.dog===d&&pottyKinds.includes(x.kind)),td=log.filter(x=>today(x.time)),last=log.find(x=>x.kind==='Outside pee'||x.kind==='Outside poop');return dogs()+section(esc(name(d))+'’s potty tracker',`<div class="grid">${metric('Outside potty today',td.filter(x=>x.kind==='Outside pee'||x.kind==='Outside poop').length)}${metric('Accidents today',td.filter(x=>x.kind==='Accident').length)}${metric('Independent rings',td.filter(x=>x.kind==='Independent bell').length)}${metric('Last outside potty',last?new Date(last.time).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'—')}</div><p class="muted">Tap what happened immediately after the event. Record the bell and potty separately if both happened.</p><div class="grid">${pottyKinds.map(k=>buttonLog(k,d)).join('')}</div>`,'hero')+section('Potty troubleshooting',`<details><summary>She rings just to go outside</summary><p>Respond promptly. Take a short, boring potty trip on leash or supervised, then come back inside if there is no potty. Play trips can use a different cue.</p></details><details><summary>Accidents or no bell ring</summary><p>Increase scheduled trips and return to prompted bell practice. Clean with enzymatic cleaner. Never punish. Sudden accidents, straining or frequent urination need veterinary advice.</p></details><details><summary>Puppy’s routine</summary><p>Take out after waking, eating, drinking, play and frequently while awake. A young puppy cannot be expected to wait for a bell or hold it for hours.</p></details>`)+section('Recent potty activity',history(log.slice(0,40)))}
function progressView(){let d=state.dog,log=state.logs.filter(x=>x.dog===d),week=log.filter(x=>Date.now()-x.time<7*86400000);return dogs()+section(esc(name(d))+'’s progress',`${progress(d)}<div class="grid" style="margin-top:13px">${metric('Good sessions · 7 days',week.filter(x=>x.kind==='Practice went well').length)}${metric('Practice needed · 7 days',week.filter(x=>x.kind==='Needs practice').length)}${metric('Outside potty · 7 days',week.filter(x=>x.kind==='Outside pee'||x.kind==='Outside poop').length)}${metric('Accidents · 7 days',week.filter(x=>x.kind==='Accident').length)}</div>`,'hero')+section('Milestone review',lessons[d].map(x=>`<div class="item"><input type="checkbox" id="c-${x.id}" ${state.done[x.id]?'checked':''} onchange="toggleDone('${x.id}')"><label for="c-${x.id}"><strong>${esc(x.title)}</strong><small>${esc(x.ready)}</small></label></div>`).join(''))+section('Activity history',history(log.slice(0,60))+'<button class="wide soft" onclick="exportCSV()">Export all activity (CSV)</button>')}
function moreView(){return section('Puppy arrival checklist',`<p class="muted">${prep.filter(x=>state.check[x[0]]).length} of ${prep.length} complete</p>${prep.map(([id,title,desc])=>`<div class="item"><input type="checkbox" id="prep-${id}" ${state.check[id]?'checked':''} onchange="toggleCheck('check','${id}')"><label for="prep-${id}"><strong>${esc(title)}</strong><small>${esc(desc)}</small></label></div>`).join('')}`)+section('Supplies checklist',supplies.map((x,i)=>`<div class="item"><input type="checkbox" id="s-${i}" ${state.supply[i]?'checked':''} onchange="toggleCheck('supply','${i}')"><label for="s-${i}">${esc(x)}</label></div>`).join(''))+section('Dog profiles & dates',`<div class="field"><label for="pname">Puppy name</label><input id="pname" maxlength="40" value="${esc(state.name)}" onchange="setField('name',this.value.trim()||'New puppy')"></div><div class="field"><label for="arrival">Expected pickup date</label><input id="arrival" type="date" value="${esc(state.arrival)}" onchange="if(this.value)setField('arrival',this.value)"></div><p class="muted">December 1, 2026 is a placeholder. Change it to the real date. Lessons do not expire.</p><div class="item"><input id="arrived" type="checkbox" ${state.arrived?'checked':''} onchange="setField('arrived',this.checked)"><label for="arrived">Puppy is home</label></div><div class="field"><label for="notes">Family notes</label><textarea id="notes" rows="4" maxlength="5000" onchange="state.notes=this.value;save();notify('Notes saved')">${esc(state.notes)}</textarea></div>`)+section('Install on iPhone',`<p>Open the hosted app in Safari, tap Share, choose Add to Home Screen, then Add. The app works offline after the first successful load when installed from HTTPS.</p><p class="muted">This file by itself is a preview. iOS can restrict file previews and storage. No push notifications are promised; use the Clock or Reminders app for alarms. Data is stored on this device, not synced.</p><button class="wide soft" onclick="exportData()">Save backup</button><div class="field"><label for="import">Restore a backup</label><input id="import" type="file" accept=".json,application/json" onchange="importData(this)"></div><button class="wide danger" onclick="resetApp()">Reset all progress</button>`)+section('Training principles',`<p>Reward good behavior, keep sessions short, and stop if either dog is uncomfortable. No punishment, forced greetings or forced confinement. If Betty has a history of biting, guarding or aggression, consult a qualified reward-based trainer before the puppy arrives.</p><p><a href="https://avsab.org/resources/position-statements/" target="_blank" rel="noopener">AVSAB training & socialization guidance</a></p><p><a href="https://www.akc.org/expert-advice/training/how-to-introduce-dogs/" target="_blank" rel="noopener">AKC dog introduction guidance</a></p><p class="note">Educational training guidance, not veterinary diagnosis. Contact a vet about health concerns.</p>`)}
function download(data,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}function exportData(){download(JSON.stringify(state,null,2),'paw-school-backup.json','application/json')}function exportCSV(){const csv=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download([['Dog','Event','Lesson','Timestamp'].map(csv).join(','),...state.logs.map(x=>[name(x.dog),x.kind,x.lesson,new Date(x.time).toISOString()].map(csv).join(','))].join('\n'),'paw-school-activity.csv','text/csv')}async function importData(el){try{let s=normalize(JSON.parse(await el.files[0].text()));if(confirm('Replace current progress with this backup?')){state=s;save();render();notify('Backup restored')}}catch(e){alert('Could not read this Paw School 2 backup. Your progress was not changed.')}el.value=''}function resetApp(){if(confirm('Permanently clear all profiles, lessons and logs on this device? Export a backup first if needed.')){state=defaults();save();render();notify('Progress reset')}}
function render(){let tab=state.tab;let views={today:todayView,train:trainView,potty:pottyView,progress:progressView,more:moreView};let headings={today:['Good dogs, good days.','Your daily plan for Betty and the little one.'],train:['Training academy','Short, reward-based lessons at your dog’s pace.'],potty:['Potty journal','Every little success counts.'],progress:['Small wins add up.','Review milestones and training history.'],more:['Get puppy-ready.','Your home, profiles and app settings.']};$('headline').textContent=headings[tab][0];$('subtitle').textContent=headings[tab][1];$('nav').innerHTML=[['today','⌂','Today'],['train','♧','Train'],['potty','◉','Potty'],['progress','▥','Progress'],['more','⚙','More']].map(([t,i,n])=>`<button onclick="go('${t}')" class="${t===tab?'active':''}" ${t===tab?'aria-current="page"':''}><b aria-hidden="true">${i}</b>${n}</button>`).join('');$('app').innerHTML=(!storageOK?'<div class="notice">Storage is unavailable. Export a backup before closing this page.</div>':'')+(storageMsg?`<div class="notice">${esc(storageMsg)} <button class="soft" onclick="storageMsg='';render()">Dismiss</button></div>`:'')+views[tab]();updateClock()}save();render();if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></body></html>
