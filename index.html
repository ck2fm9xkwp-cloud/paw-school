<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#152d28"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Paw School"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Paw School — Betty & Puppy</title><style>
:root{color-scheme:light;--bg:#f4f3ed;--ink:#172d26;--muted:#64766d;--green:#21634e;--light:#e1ede4;--line:#dce4da;--white:#fff;--gold:#ffdf9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;line-height:1.5}button,input,select,textarea{font:inherit}button{min-height:46px;border:0;border-radius:13px;background:var(--green);color:white;font-weight:700;padding:11px 15px;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c7842e;outline-offset:2px}button:disabled{opacity:.48;cursor:default}button.soft{background:var(--light);color:var(--ink)}button.outline{background:white;color:var(--green);border:1px solid var(--line)}button.danger{background:#f6e5e0;color:#942e22}header{background:#152d28;color:white;padding:calc(env(safe-area-inset-top) + 22px) max(20px,env(safe-area-inset-right)) 25px max(20px,env(safe-area-inset-left));}header .wrap{max-width:780px;margin:auto}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;letter-spacing:.11em}.mark{width:38px;height:38px;border-radius:13px;background:#d5e8c9;color:#17372b;display:grid;place-items:center;font-size:22px}header h1{font-size:clamp(27px,6vw,38px);line-height:1.1;margin:18px 0 7px;letter-spacing:-.05em}header p{color:#c3d5c9;margin:0;font-size:15px}main{max-width:780px;margin:auto;padding:16px 16px calc(98px + env(safe-area-inset-bottom));}h2{font-size:21px;letter-spacing:-.035em;margin:0 0 9px;line-height:1.2}h3{font-size:17px;margin:0 0 8px}p{margin:7px 0}small,.muted{color:var(--muted);font-size:14px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:13px;box-shadow:0 3px 14px #16382b06}.hero{background:#e5efdf;border-color:#cddfc9}.warn{background:#fff6e1;border-color:#efdcae}.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:#2d6951;display:inline-block;background:#e3eee4;padding:5px 9px;border-radius:8px;margin-bottom:9px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid button{width:100%}.stack{display:grid;gap:8px}.wide{width:100%;margin-top:10px}.metric{background:#f6f7f3;border-radius:14px;padding:13px;min-width:0}.metric strong{display:block;font-size:24px;line-height:1.2;letter-spacing:-.04em}.metric small{font-size:12px}.bar{height:9px;border-radius:20px;background:#dce7dc;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;background:#347c5f;border-radius:20px;transition:width .2s}.dogs{display:flex;gap:7px;margin-bottom:14px}.dogs button{flex:1;padding:10px 6px;background:#e4e9e0;color:#3e5147;font-size:14px}.dogs button.active{background:#21634e;color:#fff}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:flex;justify-content:center;z-index:10}.bottom button{background:transparent;color:#65766c;flex:1;max-width:155px;display:grid;justify-items:center;gap:1px;font-size:11px;padding:5px 2px;min-height:52px;border-radius:12px}.bottom button b{font-size:22px;line-height:1.1;font-weight:400}.bottom button.active{background:#e7f0e5;color:#1d5c46}.lesson{display:flex;gap:10px;align-items:center;width:100%;text-align:left;color:var(--ink);background:#fff;border:1px solid var(--line);padding:12px;margin:7px 0}.lesson .num{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:var(--light);color:var(--green)}.lesson span:nth-child(2){flex:1;min-width:0}.lesson small{display:block;font-weight:400}.steps{padding-left:23px;margin:10px 0}.steps li{padding-left:3px;margin:9px 0}.item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item input{width:23px;height:23px;accent-color:var(--green);flex:none;margin:1px 0}.item label{flex:1}.item label small{display:block}.field{margin:13px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid #bccdc0;border-radius:11px;color:var(--ink);background:white;font-size:16px}.history{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0}.history span{min-width:0}.history button{padding:6px 10px;min-height:42px}.clock{font-size:46px;font-variant-numeric:tabular-nums;letter-spacing:-.04em;font-weight:800;text-align:center;margin:8px 0}.note{font-size:13px;color:var(--muted)}a{color:#17654c}details{padding:9px 0}summary{cursor:pointer;font-weight:700}.notice{padding:10px;border-radius:10px;background:#fff2d7;margin-bottom:12px}#toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#172d26;color:white;padding:11px 18px;border-radius:14px;z-index:20;max-width:90vw;box-shadow:0 4px 15px #0002;font-size:14px;display:none}button[aria-current=true]{background:var(--green);color:white}.tiny{font-size:12px} @media(min-width:600px){main{padding-top:23px}.card{padding:22px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div class="wrap"><div class="brand"><span class="mark">🐾</span> PAW SCHOOL <span style="margin-left:auto;font-size:11px;color:#a8cbb1">3.0</span></div><h1 id="headline">Good dogs, good days.</h1><p id="subtitle">A little practice every day goes a long way.</p></div></header><main><div id="app"></div></main><nav class="bottom" aria-label="Main navigation" id="nav"></nav><div id="toast" role="status" aria-live="polite"></div><script>
'use strict';
const L=(id,title,priority,time,steps,ready,fix)=>({id,title,priority,time,steps,ready,fix});
const lessons={b:[
L('b-name','Name & focus','Start here',3,['In a quiet room, say Betty’s name once.','When she looks at you, say “yes” and reward immediately.','Repeat 5 times, then try with a tiny distraction.'], 'Looks at you 4 out of 5 times in a quiet room on two days.','Move somewhere quieter and use a reward she likes. Don’t repeat her name.'),
L('b-bell','Touch the potty bell','Essential',3,['Hang the bell at nose height, away from swinging doors.','Reward looking at it, then a gentle nose touch.','Reward a soft ring; if the sound scares her, muffle it and start farther away.'], 'Willingly rings 4 out of 5 tries on two days.', 'Reward smaller steps; never press her nose or paw into the bell.'),
L('b-bellout','Bell means outside','Essential',3,['Before each regular potty trip, ask for a bell touch.','Open the door immediately after a ring and go to the usual potty spot.','Reward outdoor pee or poop right away. If urgent, skip the bell and go out.'], 'Rings before most trips with a small cue for several days.', 'Use the same door and cue; keep potty trips calm and predictable.'),
L('b-bellsolo','Ring without help','Essential',3,['Before opening the door, give Betty a few seconds to offer a ring.','If she rings, immediately take her out; otherwise prompt once.','Respond to independent rings; make non-potty trips brief and boring.'], 'Several unprompted rings followed by potty on different days; continue routine breaks.', 'Return to the cue stage if she stops ringing; never make her wait urgently.'),
L('b-sit','Sit','Foundation',3,['Hold a treat near her nose and move it slightly upward and back.','When her bottom touches the floor, mark “yes” and reward.','Fade the lure, say “sit” once, then reward the response.'], 'Sits on one cue 4 out of 5 times on two days.', 'Use a non-slip surface; do not push her hips down.'),
L('b-come','Come when called','Essential',3,['Start a few steps away indoors. Say “Betty, come!” in a cheerful voice.','Reward generously when she reaches you; gently touch her collar if comfortable.','Practice between two people or in a fenced area. Never call her to punish her.'], 'Returns promptly 4 out of 5 times in a safe, low-distraction area.', 'Shorten the distance; use a secure leash outdoors. Do not test off-leash near roads.'),
L('b-wait','Wait at doors','Essential',3,['Start at a closed door on leash or with a barrier.','Say “wait”, open the door a crack, and reward staying back.','Close gently if she moves forward; gradually open farther and release with “okay”.'], 'Waits briefly with door open, then moves on release, 4 out of 5 times.', 'Use smaller door openings; a physical barrier remains important.'),
L('b-place','Place / settle on bed','Essential',4,['Place a mat in a quiet area. Reward stepping onto it.','Reward lying down or relaxed standing on the mat.','Say “place” once, then gradually reward calm stays for a few seconds longer. Release before she gets restless.'], 'Goes to mat on cue and relaxes for 30–60 seconds with rewards.', 'Shorten duration and move the mat away from distractions.'),
L('b-leave','Leave it','Essential',3,['Hold a treat in a closed fist. Wait for Betty to stop investigating.','Mark the moment she turns away; reward with a different treat.','Add “leave it” before showing the fist, then practice with a covered item on the floor.'], 'Turns away from a covered item 4 out of 5 times.', 'Make it easier; never practice with harmful objects or force her mouth open.'),
L('b-drop','Drop it / trade','Essential',3,['Give a low-value toy. Offer a tasty trade.','When she releases, mark and reward. Give the toy back when safe.','Add “drop” before the trade; practice with easy objects.'], 'Releases an ordinary toy willingly 4 out of 5 times.', 'Do not grab or chase her. If she guards objects, separate and seek reward-based professional help.'),
L('b-leash','Loose-leash walking','Helpful',4,['In a quiet area, reward Betty for walking near you on a loose leash.','When the leash tightens, stop calmly and reward when she returns.','Build up short, easy walks; let her sniff as a reward.'], 'Can take a short walk with a mostly loose leash in a quiet area.', 'Decrease distractions and reward more often; use a comfortable harness.'),
L('b-handling','Comfort with handling','Helpful',3,['Briefly touch a shoulder, reward, then stop.','Gradually practice paws, ears and collar with permission and rewards.','Let Betty move away whenever she wants.'], 'Remains relaxed during a few gentle touches.', 'Stop if she avoids, freezes or growls. Ask a vet about pain.'),
L('b-calm','Calm around distractions','Essential',4,['Set up a gate and reward Betty for relaxing on her bed.','Practice with a family member moving or quiet puppy sounds at low volume.','Keep distance and reward calm attention; end before she gets overwhelmed.'], 'Can relax and respond to her name near a mild distraction.', 'Increase distance and lower the noise. Do not flood her with stimulation.'),
L('b-alone','Rest behind a gate','Essential',3,['Give Betty a comfortable separate room or bed with water.','Reward calm moments behind a gate while you remain nearby.','Practice short separations and return before distress.'], 'Comfortably rests apart from you for short periods.', 'Make separations shorter; never force prolonged confinement.'),
L('b-review','December readiness review','Review',4,['Practice name, come, wait, place, leave it and drop in separate short sessions.','Review independent bell rings and keep normal potty trips.','Set up separate beds, bowls and gated spaces before pickup.'], 'Core skills are improving and the home is ready. Unfinished skills can continue after arrival.', 'Prioritize safety management over a deadline; ask a qualified trainer about reactivity or guarding.')],
p:[
L('p-settle','First day: settle in','8 weeks',2,['Show the puppy a quiet, warm sleeping area and a safe potty spot.','Keep visitors and play low-key. Offer water and breeder-recommended meals.','Stay close, allow frequent naps and learn the puppy’s body language.'], 'Puppy is eating, drinking and able to rest; discuss any concerns with the vet.', 'If the puppy is weak, vomiting, refusing food or unusually sleepy, contact a vet promptly; tiny puppies can become ill quickly.'),
L('p-potty','Potty routine','8 weeks',2,['Take the puppy out after waking, meals, drinking and play; also frequently while awake.','Reward outdoor potty immediately. Keep a supervised indoor area.','If no potty, return to supervision and try again shortly. Clean accidents with enzymatic cleaner; never punish.'], 'Outdoor potty is becoming frequent; continue scheduled breaks regardless of accidents.', 'Start with breaks about every 30–60 minutes while awake and adjust to the puppy. Night breaks may be needed.'),
L('p-name','Name & attention','8 weeks',2,['Say the puppy’s name once when nearby.','Mark and reward looking at you.','Do 3–5 easy repetitions and finish before the puppy gets tired.'], 'Looks toward you most times in a quiet room.', 'Reduce noise and reward small head turns.'),
L('p-crate','Crate / pen comfort','8 weeks',2,['Place a comfortable crate or pen in a quiet area. Leave the crate door open.','Reward voluntary entry and offer meals or safe toys inside.','Build very short door-closed moments while you stay close; release before distress.'], 'Enters willingly and can rest comfortably for a short time.', 'Make it easier. Never use a crate as punishment or for long stretches beyond potty needs.'),
L('p-bell','Gentle bell touch','8–10 weeks',2,['Reward looking at the bell and voluntary nose touches.','Keep the sound soft and let the puppy move away.','Let the puppy watch Betty if both are comfortable, but practice individually.'], 'Touches or rings willingly without fear.', 'Keep the regular potty schedule. A young puppy is not ready to rely on the bell alone.'),
L('p-bellout','Bell before potty','8–12 weeks',2,['Prompt a gentle bell touch before a routine potty trip.','Open the door immediately and reward outdoor potty.','If puppy needs to go now, skip the bell and take them out.'], 'Often touches the bell with a cue before trips.', 'Continue predictable breaks; never delay potty to practice a trick.'),
L('p-sit','Sit','8–12 weeks',2,['Lure a sit with a tiny treat near the nose, moving slightly up.','Mark and reward when the bottom touches the ground.','Gradually use an empty hand and add the word “sit”.'], 'Responds to a simple cue in a quiet room.', 'Keep sessions very short; avoid pushing or holding the puppy in position.'),
L('p-come','Come','8–12 weeks',2,['Call the puppy cheerfully from a few steps away.','Reward reaching you with food, play or praise.','Practice in a safe enclosed room; never chase the puppy.'], 'Comes readily over short distances indoors.', 'Use a shorter distance and better rewards. Use leash or fence outside.'),
L('p-social','Safe socialization','8–16 weeks',2,['Introduce calm people, household sounds and surfaces at a comfortable distance.','Reward curiosity and let the puppy choose whether to approach.','Ask your vet about local infection risk and safe contact with healthy, vaccinated dogs; avoid dog parks and unknown dog waste.'], 'Puppy has brief positive experiences without fear; continue throughout life.', 'Stop if fearful. Increase distance, reduce intensity and seek vet guidance if fear persists.'),
L('p-bite','Puppy biting & chewing','8–16 weeks',2,['Keep safe chew toys nearby. Redirect teeth from hands to a toy.','If play gets too rough, calmly pause and give space.','Check whether the puppy needs sleep, food, a potty break or a quieter activity.'], 'Can redirect to an appropriate toy more often.', 'Never hit, shout or hold the muzzle. Prevent access to cords and small objects.'),
L('p-handle','Gentle handling & grooming','8–16 weeks',2,['Touch a shoulder briefly, reward and stop.','Introduce a soft brush, paws, ears and collar in tiny steps.','Pair each comfortable touch with a treat; allow choice.'], 'Comfortable with brief brushing and touch.', 'Stop if the puppy pulls away. Ask a groomer or vet how to care for the coat.'),
L('p-leave','Leave it & trade','10–16 weeks',2,['Reward turning away from a closed hand holding a treat.','Trade a low-value toy for a tasty reward; return it when safe.','Add cues only once the behaviors are easy.'], 'Can turn away and trade a toy without stress.', 'Avoid chasing or taking items by force; manage the environment.'),
L('p-leash','Harness & leash introduction','8–16 weeks',2,['Let the puppy sniff the harness and reward.','Practice putting it on briefly without forcing.','Take a few rewarded steps indoors; ask the vet about safe outdoor walks.'], 'Comfortably wears the harness and follows for a few steps.', 'Stop if afraid; choose a properly fitted lightweight harness.'),
L('p-alone','Short alone-time practice','8–16 weeks',2,['Set up a safe pen with a comfortable bed and water.','Start with seconds apart while puppy is calm and awake.','Gradually increase only when relaxed; plan for potty and human company.'], 'Can stay calm briefly while you step away.', 'Return before distress; if separation problems persist, get professional help.'),
L('p-solo','Independent potty signals','Ongoing',2,['Pause briefly at the door to let the puppy offer a ring.','Immediately respond to voluntary rings and reward outdoor potty.','Keep scheduled trips until reliable over time; log accidents without punishment.'], 'Repeated reliable signals across days and fewer accidents; reliability can take months.', 'Increase regular potty breaks if accidents recur. Ask a vet about sudden changes.')],
t:[
L('t-prep','Prepare separate spaces','Before arrival',3,['Set up a gate or pen, two beds, separate feeding stations and water.','Put high-value toys and chews away before meetings.','Plan an adult helper for introductions and give Betty her regular one-on-one time.'], 'Both dogs have separate safe spaces; family agrees on supervision.', 'Do not leave a tiny puppy alone with Betty, even if she seems friendly.'),
L('t-meet','First meeting','Arrival day',3,['Choose a quiet, clean, private space approved by the vet for the puppy. Have one adult manage each dog.','Allow relaxed distance and brief sniffing only if both choose it. Reward calm behavior.','Separate before either gets tired. Do not force greetings or hold the puppy up to Betty’s face.'], 'Both dogs can stay loose-bodied and disengage comfortably.', 'Separate if stiff, staring, growling, hiding or chasing. Seek a qualified trainer if repeated.'),
L('t-gate','Relax on opposite sides of a gate','First week',3,['Use a secure gate with space on both sides; supervise.','Reward each dog for noticing the other and relaxing.','Keep sessions short and give both dogs rest away from each other.'], 'Both can settle without barking, lunging or fixating.', 'Increase distance, block the view if needed, and shorten sessions.'),
L('t-turn','Take turns training','First weeks',3,['One person trains Betty while the puppy rests separately.','Swap and practice the puppy’s easy cues.','Later reward calm waiting behind a gate while the other dog practices.'], 'Both dogs can practice without crowding or stealing rewards.', 'Keep food rewards separate; avoid competition.'),
L('t-bell','Watch Betty ring the bell','First weeks',2,['Take Betty to the door and let her ring.','Let the puppy observe from a safe distance with another adult or behind a gate.','Give the puppy separate bell practice and independent potty rewards.'], 'Both are comfortable with the bell and potty routine.', 'The puppy may not copy Betty. Keep individual training and frequent potty trips.'),
L('t-play','Supervised gentle play','Ongoing',3,['Allow brief play only when both dogs are loose and interested.','Pause often; reward disengaging and give breaks.','Protect the small puppy from body slams, chasing or rough size-mismatched play.'], 'Both dogs choose to re-engage after breaks and can disengage.', 'Separate immediately if one cannot escape or looks worried. No unsupervised play.'),
L('t-routine','Build a shared routine','Ongoing',3,['Feed separately and remove food bowls after meals as appropriate; keep fresh water available.','Keep Betty’s walks and attention, plus separate puppy naps and potty breaks.','Review both dogs’ progress weekly and continue individual skills.'], 'Both dogs can rest, eat and train without conflict.', 'If guarding, snapping or repeated fear occurs, use separation and contact a vet or qualified behavior professional.')]
};
const prep=[['spaces','Separate beds, gate or secure pen','Give each dog an escape and a quiet place to sleep.'],['food','Separate feeding areas and water bowls','No shared high-value chews or food during early introductions.'],['vet','Book puppy vet visit','Confirm vaccination, parasite prevention, local infection risk and feeding plan.'],['proof','Puppy-proof home','Block cords, toxic plants, medicines, small objects and stairs.'],['supplies','Potty bell, harness, leash, cleaner and tiny treats','Choose puppy-safe sizes and a non-slip potty route.'],['winter','Plan for Alberta winter','Clear a safe potty spot, keep trips short in extreme cold and dry paws.'],['family','Agree on rules with family','Use the same cues, supervise together and keep a daily potty routine.'],['intro','Plan introduction with an adult helper','Separate food, toys and rest; no unsupervised time together.']];

/* Paw School 3: extended curriculum; existing lesson IDs and storage remain unchanged. */
lessons.b.push(
L('b-hiddenreward','Come without showing a treat','Recall upgrade',3,['Put 5 tiny pieces of Betty’s regular food in your pocket before starting. Begin in a quiet room, a few steps away.','Say “Betty, come” once, then move backwards cheerfully. Keep your hands empty and reward when she reaches you.','Practice five easy repetitions; reward every success at first. Once she is reliable, mix food with play or praise she enjoys, occasionally giving a surprise jackpot.','If she ignores you, don’t repeat the cue or scold. Move closer, get her attention and make the next repetition easier. Never call her to something unpleasant if you can go get her instead.'], 'Comes 4 out of 5 times with no visible food over several sessions; gradually add distance.', 'Keep food hidden, not absent. Use a leash or secure enclosure outside; a hallway, another dog or a smell can be a distraction.'),
L('b-down','Down & release','Foundation',3,['Start with Betty standing or sitting on a non-slip floor.','Move a food lure from nose level down to the floor, then slightly forward. Mark when elbows touch the floor.','Reward low between paws; say “okay” to release. Fade to an empty hand, then add “down” before the gesture.'], 'Lies down on one cue in two easy locations.', 'Reward a smaller bend; do not force her joints or push her back. Ask a vet if movement seems painful.'),
L('b-reward','Train using meals and real-life rewards','Every day',3,['Set aside a small portion of her usual daily kibble before meals for practice; use tiny, soft pieces of dog-safe treats for harder skills.','Say the cue without displaying food. Mark the correct action with “yes”, then deliver the reward from your pocket.','Use access to sniffing, a toy, praise or opening the door when these are rewarding to Betty. Continue high-value rewards for difficult recalls.'], 'Responds happily to familiar cues without seeing food first.', 'If motivation drops, improve the reward or reduce difficulty. Keep extras within about 10% of daily calories; ask the vet about her individual feeding needs.'),
L('b-greeting','Polite greetings','Before puppy',3,['Ask a family member to stand quietly. Reward Betty for four paws on the floor.','If she jumps, the person calmly pauses attention; reward when paws are down again.','Let her approach or disengage freely. Practice with a gate if she becomes excited.'], 'Greets a familiar person calmly for several repetitions.', 'Increase distance; do not knee, yell at or shove her.'),
L('b-emergency','Emergency recall','Safety',3,['Choose a fresh word everyone agrees to reserve for emergencies, such as “here-now”.','Say it once in an easy location and immediately give several excellent tiny rewards when Betty arrives. Practice occasionally, not constantly.','Build distance in a secure enclosure or on a long line attached to a harness; never test near traffic.'], 'Responds enthusiastically in several safe environments.', 'Return to easy practice and premium rewards; emergency recall is never a substitute for a leash or gate.')
);
lessons.p.push(
L('p-marker','Teach the “yes” marker','8–10 weeks',1,['In a quiet room, prepare five tiny pieces of puppy kibble.','Say “yes” once, then immediately give one piece. Repeat 3–5 times.','Next, mark a voluntary look toward you and reward. The marker identifies the exact action that earned the reward.'], 'Looks expectantly after hearing “yes”; keep pairing the marker with a reward.', 'Use a soft voice and finish before she gets distracted or sleepy.'),
L('p-touch','Touch my hand','8–10 weeks',2,['Hold an open palm a few centimetres from her nose.','Mark and reward a voluntary sniff or nose touch; never push your hand into her face.','Present your palm in slightly different positions, then add “touch” before offering it.'], 'Touches your hand willingly on cue at close range.', 'Bring the hand closer and reward a look or sniff first.'),
L('p-down','Lie down','10–12 weeks',2,['On a non-slip mat, guide a tiny food lure from nose toward floor, then forward.','Mark when elbows reach the floor and reward between her paws. Release with “okay”.','Use the same motion with an empty hand, then say “down” just before the gesture.'], 'Lies down on one cue in a quiet area.', 'Reward small movements; never push or pull her into position.'),
L('p-wait','Wait and release','10–12 weeks',2,['With a gate or leash as backup, ask for one second of stillness before opening a door or placing a bowl.','Mark and reward staying back; say “okay” and allow access.','Increase by a second at a time. Keep food and potty access easy; do not make a young puppy wait when urgent.'], 'Waits 2–3 seconds then moves on the release cue.', 'Make it shorter and use a barrier, not physical restraint.'),
L('p-mat','Place: settle on a mat','10–12 weeks',2,['Put a mat on the floor and reward looking at or stepping on it.','Reward voluntary sitting or lying on the mat; give treats low between paws.','Add “place” as she begins moving toward the mat. Release after a few calm seconds.','Gradually practice while you sit nearby, then move one step away.'], 'Chooses the mat and relaxes for 10–20 seconds with rewards.', 'Reduce distractions; never send her to the mat as punishment.'),
L('p-drop','Drop it: safe trades','10–12 weeks',2,['Offer a safe, low-value toy. When she holds it, offer a tiny food reward.','Mark the moment she releases; reward and return the toy if safe.','Repeat, then say “drop” immediately before presenting the trade. Fade visible food by keeping it in your pocket.'], 'Releases an ordinary toy happily on cue.', 'Do not chase, pry her mouth open or practice with dangerous objects. If she stiffens or guards, stop and ask a professional.'),
L('p-leaveit','Leave it: ignore an item','12–16 weeks',2,['Hold a treat in a closed hand. Wait quietly until she turns away, then mark.','Reward from the other hand; never give the item you asked her to leave.','Add “leave it” before presenting the fist. Progress to a covered item on the floor, then a safe object at a distance.'], 'Disengages from a safe covered item on one cue.', 'Cover the object and reduce difficulty; never train with actual hazards.'),
L('p-socialpeople','Socialization: people and sounds','8–16 weeks',2,['Let her observe one calm person, hat, umbrella or household sound from a distance where she is relaxed.','Pair the experience with tiny rewards or play. Allow her to approach or retreat; nobody needs to touch her.','Try a few seconds of a new sound at low volume. Stop while she is still comfortable. Record what she explored.'], 'Can notice a variety of experiences and recover comfortably; no forced greetings.', 'If she hides, freezes, refuses rewards or tries to escape, reduce intensity or leave. Ask your vet about safe outings and puppy classes before full vaccination.'),
L('p-socialworld','Socialization: surfaces and travel','8–16 weeks',2,['Explore safe carpet, tile, a towel and a stable low surface at home. Reward voluntary exploration.','Introduce a secured carrier or car harness; practice in a parked car, then short calm trips with an adult.','Observe traffic, people or dogs from a clean, vet-approved spot or from your arms/carrier. Avoid dog parks and unknown dog waste.'], 'Investigates new safe surfaces and travel setups without significant fear.', 'Slow down, make experiences quieter and seek veterinary guidance if motion sickness or persistent fear occurs.'),
L('p-groom','Bernedoodle coat & brush routine','8–16 weeks',2,['Let her sniff a soft brush, mark and reward. Touch shoulder with the brush for one second, reward, then stop.','Gradually brush small sections, including legs and chest, while she is relaxed. Ask a groomer to demonstrate gentle combing to the skin for her coat.','Practice brief paw, ear and face handling separately. Schedule an introductory groom when your vet says it is appropriate.'], 'Accepts several gentle strokes and brief touches while relaxed.', 'Never pull through mats, cut mats with scissors, or force restraint. A professional groomer can help with tangles.'),
L('p-mouth','Toothbrush and nail-care comfort','8–16 weeks',2,['Let her investigate a dog toothbrush and pet-safe toothpaste; reward.','Briefly touch the outside of her muzzle, then eventually lift a lip for a second; stop if she moves away.','For nails, reward a brief paw touch, then the sight of clippers or grinder at a distance. Ask a vet or groomer to demonstrate trimming.'], 'Comfortable with short voluntary handling and seeing the tools.', 'Do not use human toothpaste or force her mouth open. Stop if fearful or painful.'),
L('p-night','First nights and sleep','8–10 weeks',2,['Place a safe pen or crate near your sleeping area if possible; keep bedding safe and comfortable.','Take her to the potty spot before bed and when she wakes needing to go. Keep trips quiet.','If she cries, check potty, comfort, temperature and health needs. Build independence gradually during daytime practice; give plenty of naps.'], 'Can settle with appropriate support and has a manageable nighttime potty routine.', 'Do not leave a distressed young puppy to cry indefinitely; seek vet advice for persistent distress or illness.'),
L('p-stay','Stay with a release word','3–4 months',2,['Ask for a comfortable sit or down, say “stay”, wait one second, mark and reward in position.','Say “okay” to release before she gets up. Repeat a few times.','Add one second OR one small step of distance, not both together. Return to her to reward.'], 'Stays briefly while you take a step, then waits for release.', 'Shorten duration and avoid slippery or distracting places.'),
L('p-loose','Loose leash in real life','3–4 months',3,['Practice inside with a well-fitted lightweight harness and leash, rewarding her near your leg.','When the leash tightens, stop gently; mark and reward when she turns toward you or the leash loosens.','Once vet-approved for walks, practice on a quiet route and use sniff breaks as rewards.'], 'Walks a short stretch with a loose leash and checks in.', 'Shorten the walk; avoid leash jerks, forced exercise and crowded routes.'),
L('p-recall2','Recall with distractions','3–4 months',3,['Practice short recalls indoors with hidden food. Reward every successful arrival.','Add one easy distraction, such as a stationary toy. Call once when she can succeed and reward well.','Progress to a securely fenced area or long line on a harness. Practice calling, rewarding and releasing her to explore again.'], 'Returns on one cue with mild distractions in a controlled area.', 'Decrease distance or distraction. Never let a puppy off leash in an unsecured area.'),
L('p-door','Door and gate safety','3–4 months',3,['Keep a physical gate or leash in place. Practice waiting one second before opening a door slightly.','Reward staying on the safe side, then release on cue when safe.','Increase door opening slowly and practice with different family members.'], 'Waits at a partly open door until released with a barrier in place.', 'Close the door gently and make it easier; do not rely on a cue alone near traffic.'),
L('p-greet','Four paws on the floor','3–4 months',2,['Have a familiar person stay still while you reward four paws on the floor.','Invite a calm greeting only when she is comfortable. Pause attention if she jumps, then reward paws down.','Practice with short visits and let her opt out.'], 'Greets a familiar person without jumping most times.', 'Use a gate and more distance; never punish jumping.'),
L('p-alone2','Build comfortable independence','3–6 months',3,['After potty and a calm activity, give her a safe pen and a suitable chew or toy.','Step away for seconds while she is relaxed; return before distress.','Vary short absences and increase gradually. Arrange human care and potty breaks instead of leaving her beyond her ability.'], 'Can settle during brief everyday absences without distress.', 'If pacing, barking or panic starts, shorten the next absence and seek qualified help if it persists.'),
L('p-calm','Settle when the house is busy','4–6 months',3,['Practice place in a quiet room, reward calm breathing or resting.','Add a low-level distraction, such as a person walking past. Reward before she gets too excited.','Gradually practice during meals or TV time with a gate or leash for management.'], 'Relaxes on her mat for several minutes with support.', 'Reduce activity and duration; give a potty break or nap if needed.'),
L('p-emergency','Emergency recall word','4–6 months',3,['Choose a special word different from daily “come”. Practice in a quiet room with several excellent tiny rewards ready.','Say the word once, reward generously when she arrives, then release. Practice occasionally so it stays special.','Build distance only in secure areas or with a long line attached to a harness.'], 'Responds enthusiastically in several controlled locations.', 'Never test near traffic or rely on recall instead of physical safety.'),
L('p-checkin','Check in around dogs and people','4–6 months',3,['Start far enough away from a calm dog or person that your puppy can still respond to you.','Mark and reward looking back at you voluntarily; move away if she becomes tense or too excited.','Practice walking past at a comfortable distance without requiring greetings.'], 'Can notice a mild distraction and reorient to you.', 'Increase distance. Avoid leash corrections and crowded dog parks.'),
L('p-heel','Close walking for short stretches','6–12 months',3,['Reward standing beside your leg, then take one or two steps and reward again.','Add a cue such as “close” as she starts to understand. Release to sniff after a short stretch.','Build gradually across safe environments; ordinary walks do not need constant heel.'], 'Walks beside you for a few steps on cue with a loose leash.', 'Reduce distance and reward more often.'),
L('p-advanced','Recall, stay and place around distractions','6–12 months',4,['Choose one familiar skill and one new difficulty: distance, duration or distraction.','Start much easier than at home and reward success; change only one variable at a time.','Record 5 attempts, aim for 4 comfortable successes across several sessions, and return to easier practice if performance drops.'], 'Responds reliably in several controlled settings; continue lifelong practice.', 'Adolescent dogs may temporarily struggle. Refresh basics, reward more and use barriers and leashes.'),
L('p-fun','Fun tricks and enrichment','6–12 months',3,['Teach a nose touch, find-it with a few pieces of kibble, or a gentle spin on a non-slip surface.','Mark tiny voluntary steps, reward, and stop before fatigue.','Use age-appropriate sniffing games and food puzzles with supervision; avoid repetitive high jumps or strenuous exercise.'], 'Enjoys engaging with you and can solve simple games.', 'Choose easier games and safe toy sizes; remove damaged toys.'),
L('p-maintain','First-year graduation and maintenance','6–12 months',3,['Review name, recall, leash, drop, leave, wait, place, potty and grooming in different safe settings.','Practice a few skills each week, reward spontaneous good choices and continue positive social experiences.','If a behavior changes suddenly, consider health and stress before assuming disobedience. Ask a vet or reward-based trainer for persistent problems.'], 'Core skills work in everyday controlled situations; keep learning throughout life.', 'Revisit foundations and prioritize safety rather than perfection.')
);

L('t-protect','Protect the puppy during play','Arrival onward',3,['Begin with both dogs separated by a gate; reward calm looks and relaxed bodies.','When both are comfortable, allow brief supervised interaction with an adult ready to separate them. Interrupt rough chasing early by calling dogs apart or using barriers.','Feed separately, remove valuable chews, and give Betty a puppy-free retreat. Never leave them alone together simply because one meeting went well.'], 'Both can disengage and rest; interactions are calm and voluntary.', 'Separate immediately for stiff posture, hard staring, hiding, growling or escalating rough play. Do not punish a growl; seek qualified help if repeated.'),
L('t-recall','Two dogs: separate recall cues','First weeks',3,['Practice each dog’s name and recall in different rooms first.','With an adult helping and a gate between them, call Betty, reward her, then separately call the puppy.','Later practice taking turns in a calm enclosed area; reward the waiting dog too.'], 'Each dog responds to their own name in easy situations.', 'Return to separate practice if competition or excitement builds.')
);
const stages=[['8–10 weeks','First days, potty, bonding, name, crate, marker, touch and gentle handling.'],['10–12 weeks','Sit, down, come, wait, mat, trades and safe social experiences.'],['3–4 months','Stay, leash, door safety, leave it, recall and polite greetings.'],['4–6 months','Calm house manners, independence, emergency recall and check-ins.'],['6–12 months','Reliable skills in varied settings, enrichment and lifelong practice.']];
const socialItems=['Calm people at a distance','Household sounds at low volume','Hats, umbrellas or bulky coats','Safe indoor surfaces','Gentle brushing and paw touches','Carrier and short car trips','Vet-approved healthy dog introductions','Quiet outdoor observation in a safe location','Vet-approved reward-based puppy class'];
function roadmap(){return section('Puppy roadmap · 8 weeks to 1 year',stages.map(([a,b])=>'<div class="item"><div><strong>'+a+'</strong><p class="muted">'+b+'</p></div></div>').join('')+'<p class="note">Age ranges are suggestions, not deadlines. Start with easy skills, keep socialization positive from day one, and adjust to the puppy’s comfort and veterinary advice.</p><button class="wide soft" onclick="dog(\'p\');go(\'train\')">Open puppy lessons</button>')}
function rewardGuide(){return section('Rewards without overfeeding','<p><strong>Hide the reward, not the motivation.</strong> Keep a few pieces of regular daily kibble in your pocket. Say the cue once, mark the right action, then reward from your pocket. At first reward every correct response. Later vary food with praise, toys or sniffing if your dog enjoys them. Difficult recalls deserve excellent rewards.</p><p>Use tiny pieces; count extras toward daily intake. As a general guide, extra treats should be no more than 10% of daily calories. Do not cut a growing puppy’s balanced meals or delay meals to make her hungry for training. Ask your vet about feeding frequency and amounts for a very small puppy.</p><p class="note">Avoid unsafe human foods and oversized treats. Stop a session when either dog loses interest.</p>')}
function socialChecklist(){return section('Socialization journal', '<p>Check a box after a comfortable, positive experience; repeat experiences gently over time. This is not a checklist of things to force.</p>'+socialItems.map((x,i)=>'<div class="item"><input type="checkbox" id="social-'+i+'" '+(state.check['social-'+i]?'checked':'')+' onchange="toggleCheck(\'check\',\'social-'+i+'\')"><label for="social-'+i+'">'+esc(x)+'</label></div>').join('')+'<p class="note">Ask your vet about infection risk and vaccinations. Avoid dog parks, unknown dog waste and forced interactions. <a href="https://avsab.org/resources/position-statements/" target="_blank" rel="noopener">Veterinary behavior guidance</a></p>')}
function puppyDay(){return section('First day & tiny puppy safety','<p><strong>First day:</strong> quiet arrival, potty, water, familiar food, a safe rest area, brief name games and gentle introduction to Betty with barriers. A few one-minute lessons are enough.</p><p><strong>Daily:</strong> potty after waking, food, play and naps, and frequently while awake. Start around every 30–60 minutes and adjust. Reward outdoors immediately. Keep the bell optional until reliable.</p><p>Arrange an early vet visit, bring vaccine and feeding records, and ask about a feeding schedule for a micro mini puppy. Tiny puppies can become unwell quickly: unusual weakness, shaking, collapse, repeated vomiting or refusal to eat needs prompt veterinary advice; collapse or severe weakness is an emergency. Protect her from cold, falls and rough play. In an Alberta winter, keep outdoor potty trips brief and supervised.</p>','warn')}
function lessonGroup(d){const groups=d==='p'?[['All','all'],['First weeks','early'],['3–4 months','middle'],['4–6 months','later'],['6–12 months','older']]:[['All','all'],['Essentials','essential']];const key=state.filterDog===d?state.lessonFilter||'all':'all';let list=lessons[d].filter(x=>key==='all'||(d==='p'?(key==='early'?/8|10|12|16|Ongoing/.test(x.priority)&&!x.priority.includes('months'):key==='middle'?x.priority.includes('3–4'):key==='later'?/4–6|3–6/.test(x.priority):x.priority.includes('6–12')):/Essential|Safety|Before|Recall/.test(x.priority)));return '<div class="row" style="flex-wrap:wrap;margin-bottom:10px">'+groups.map(([label,k])=>'<button class="'+(key===k?'':'soft')+'" onclick="filterLessons(\''+d+'\',\''+k+'\')">'+label+'</button>').join('')+'</div>'+list.map(x=>'<button class="lesson" onclick="openLesson(\''+x.id+'\')"><span class="num">'+(state.done[x.id]?'✓':lessons[d].indexOf(x)+1)+'</span><span>'+esc(x.title)+'<small>'+esc(x.priority)+' · '+x.time+' min</small></span><span>›</span></button>').join('')}
function filterLessons(d,k){state.filterDog=d;state.lessonFilter=k;save();render()}

const puppyOrder=['p-settle','p-potty','p-marker','p-name','p-crate','p-night','p-social','p-socialpeople','p-socialworld','p-handle','p-bell','p-bellout','p-touch','p-bite','p-sit','p-come','p-groom','p-mouth','p-leash','p-alone','p-down','p-wait','p-mat','p-drop','p-leave','p-leaveit','p-solo','p-stay','p-loose','p-recall2','p-door','p-greet','p-alone2','p-calm','p-emergency','p-checkin','p-heel','p-advanced','p-fun','p-maintain']; lessons.p.sort((a,b)=>puppyOrder.indexOf(a.id)-puppyOrder.indexOf(b.id));
const supplies=['Secure baby gate or puppy pen','Comfortable beds / crate','Separate bowls and fresh water','Puppy food recommended by breeder / vet','Small training treats or kibble','Properly fitted harness and leash','Potty bell and enzymatic cleaner','Puppy-safe chew toys and brush','Vet appointment and records'];
const defaults=()=>({v:2,dog:'b',tab:'today',arrival:'2026-12-01',name:'New puppy',start:'2026-11-15',done:{},logs:[],check:{},supply:{},focus:{},notes:'',arrived:false});
let state=defaults(), storageOK=true, storageMsg='';try{let raw=localStorage.getItem('pawschool-v2');if(raw){state=normalize(JSON.parse(raw))}else{let old=JSON.parse(localStorage.getItem('pawschool-v1')||'null');if(old){state.arrival=old.arrival||state.arrival;state.name=old.name||state.name;storageMsg='Previous puppy name and arrival date imported. New lessons have their own milestones.'}}}catch(e){storageOK=false}function normalize(s){if(!s||s.v!==2||!Array.isArray(s.logs)||!s.done||typeof s.done!=='object')throw Error('Not a Paw School 2 backup');let d=defaults();return {...d,...s,dog:['b','p','t'].includes(s.dog)?s.dog:'b',tab:['today','train','potty','progress','more'].includes(s.tab)?s.tab:'today',logs:s.logs.filter(x=>x&&typeof x.id==='string'&&/^[a-z0-9-]{1,80}$/.test(x.id)&&typeof x.time==='number'&&Number.isFinite(x.time)&&Math.abs(x.time)<8640000000000000&&['b','p','t'].includes(x.dog)).slice(0,10000),check:s.check||{},supply:s.supply||{},focus:s.focus||{},done:s.done||{},arrival:/^\d{4}-\d{2}-\d{2}$/.test(s.arrival)?s.arrival:d.arrival,name:String(s.name||d.name).slice(0,40),notes:String(s.notes||'').slice(0,5000)}}
function save(){try{localStorage.setItem('pawschool-v2',JSON.stringify(state));storageOK=true}catch(e){storageOK=false}}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=x=>document.getElementById(x);const name=d=>d==='b'?'Betty':d==='p'?state.name:'Both dogs';const fmt=t=>new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});const today=t=>new Date(t).toDateString()===new Date().toDateString();const days=()=>Math.max(0,Math.round((new Date(state.arrival+'T00:00:00')-new Date(new Date().setHours(0,0,0,0)))/86400000));const cnt=d=>lessons[d].filter(l=>state.done[l.id]).length;const first=d=>lessons[d].find(l=>!state.done[l.id])||lessons[d][0];const selected=d=>lessons[d].find(l=>l.id===state.focus[d])||first(d);let timerEnd=0,timerRemaining=0,timerTick=null,toastTimer;function notify(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2400)}function go(tab){state.tab=tab;save();render();window.scrollTo(0,0)}function dog(d){state.dog=d;save();render()}function openLesson(id){state.focus[state.dog]=id;go('train')}function add(kind,lesson='',d=state.dog){state.logs.unshift({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),dog:d,kind,lesson,time:Date.now()});save();render();notify('Saved: '+kind)}function toggleDone(id){state.done[id]=!state.done[id];save();render();notify(state.done[id]?'Milestone completed!':'Milestone reopened')}function toggleCheck(group,id){state[group][id]=!state[group][id];save();render()}function removeLog(id){if(!confirm('Delete this log?'))return;state.logs=state.logs.filter(l=>l.id!==id);save();render()}function setField(k,v){state[k]=v;save();render()}function clockText(){let s=timerEnd?Math.max(0,Math.ceil((timerEnd-Date.now())/1000)):timerRemaining;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function updateClock(){if($('clock'))$('clock').textContent=clockText();if(timerEnd&&Date.now()>=timerEnd){timerEnd=0;timerRemaining=0;clearInterval(timerTick);timerTick=null;notify('Session finished! Reward and give your dog a break.');if($('clock'))$('clock').textContent='00:00';if($('timerstatus'))$('timerstatus').textContent='Finished — time for a break.';}}function startTimer(min){timerRemaining=min*60;timerEnd=Date.now()+timerRemaining*1000;clearInterval(timerTick);timerTick=setInterval(updateClock,250);updateClock();if($('timerstatus'))$('timerstatus').textContent='Running while this page is open.'}function stopTimer(){timerRemaining=0;timerEnd=0;clearInterval(timerTick);timerTick=null;updateClock();if($('timerstatus'))$('timerstatus').textContent='Timer reset.'}
function dogs(){return `<div class="dogs" aria-label="Dog profile">${[['b','🐕 Betty'],['p','🐶 '+esc(state.name)],['t','🐾 Together']].map(([d,n])=>`<button class="${state.dog===d?'active':''}" aria-pressed="${state.dog===d}" onclick="dog('${d}')">${n}</button>`).join('')}</div>`}function progress(d){let n=cnt(d),total=lessons[d].length;return `<div class="bar" role="progressbar" aria-valuenow="${n}" aria-valuemax="${total}"><span style="width:${n/total*100}%"></span></div><small>${n} of ${total} milestones met · ${Math.round(n/total*100)}%</small>`}function metric(label,value){return `<div class="metric"><strong>${esc(value)}</strong><small>${esc(label)}</small></div>`}function section(title,body,cls=''){return `<section class="card ${cls}"><h2>${title}</h2>${body}</section>`}function history(list){return list.length?list.map(l=>`<div class="history"><span><strong>${esc(l.kind)}</strong><br><small>${esc(name(l.dog))} · ${esc(fmt(l.time))}${l.lesson?' · '+esc(l.lesson):''}</small></span><button class="outline" aria-label="Delete log" onclick="removeLog('${esc(l.id).replace(/&#39;/g,'')}')">✕</button></div>`).join(''):'<p class="muted">No activity logged yet.</p>'}function buttonLog(k,d){return `<button class="${k==='Accident'?'soft':''}" onclick="add('${k}','','${d}')">${k}</button>`}const pottyKinds=['Outside pee','Outside poop','Independent bell','Prompted bell','Accident','No potty'];
function todayView(){let d=state.dog,l=first(d),pc=state.logs.filter(x=>x.dog===d&&today(x.time));let until=days();let out=dogs();out+=section(d==='b'?'Betty’s December mission':d==='p'?esc(state.name)+'’s first weeks':'Two dogs, one happy home',`<span class="tag">${d==='b'?'Almost 5 · adult':d==='p'?'Micro mini Bernedoodle':'Supervised only'}</span><p>${d==='b'?(until?`<strong>${until} days</strong> until the selected pickup date. Focus on progress, not perfection.`:'Pickup date has arrived or passed. Keep training at Betty’s pace.'):d==='p'?'Begin at arrival, around 8 weeks old. Keep sessions short and potty trips frequent.':'Build calm interactions. Give each dog a separate place to rest.'}</p>${progress(d)}<div class="grid" style="margin-top:14px">${metric('Sessions today',pc.filter(x=>x.kind==='Practice went well'||x.kind==='Needs practice').length)}${metric('Potty successes today',pc.filter(x=>x.kind==='Outside pee'||x.kind==='Outside poop').length)}</div>`,'hero');out+=section('Your next lesson',`<span class="tag">${esc(l.priority)} · ${l.time} min</span><h3>${esc(l.title)}</h3><p>${esc(l.steps[0])}</p><button class="wide" onclick="openLesson('${l.id}')">Start lesson</button>`);if(d==='b'){let phase=until>10?'Build the basics':until>4?'Practice with distractions':'Prepare the home & review';out+=section('Preparation plan',`<p><strong>${phase}</strong></p><div class="item"><span>01</span><div><strong>First 4–5 days</strong><p class="muted">Name, bell, sit and come. Practice bell on every normal potty trip.</p></div></div><div class="item"><span>02</span><div><strong>Next week</strong><p class="muted">Wait, place, leave it and drop it. Keep practicing the earlier skills.</p></div></div><div class="item"><span>03</span><div><strong>Before pickup</strong><p class="muted">Calm behind gates, independent bell and setup for the puppy. Repeat skills instead of rushing.</p></div></div><button class="wide soft" onclick="go('more')">Open arrival checklist</button>`)}if(d==='p')out+=section('Daily puppy rhythm',`<p><strong>Wake → potty → meal → potty → short play/training → potty → nap.</strong></p><p>Offer breaks often while awake (start around every 30–60 minutes), after meals, play and naps, and overnight as needed. Ask your vet about meals for a tiny puppy.</p><p class="muted">Bell training is extra; don’t wait for a signal. Keep outdoor visits safe and warm.</p>`);if(d==='p')out+=roadmap()+puppyDay()+socialChecklist();if(d==='b')out+=rewardGuide();if(d==='t')out+=section('Safety first','<p>Use gates, separate meals and supervise every interaction. Give Betty time alone and protect the little puppy from rough play. If either dog is tense or fearful, separate them.</p>','warn');return out+section('Today’s activity',history(pc.slice(0,5)))}
function trainView(){let d=state.dog,l=selected(d),good=state.logs.filter(x=>x.lesson===l.title&&x.dog===d&&x.kind==='Practice went well').length,not=state.logs.filter(x=>x.lesson===l.title&&x.dog===d&&x.kind==='Needs practice').length;return dogs()+section('Training coach',`<span class="tag">${esc(l.priority)} · ${l.time} min</span><h3>${esc(l.title)}</h3><ol class="steps">${l.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="notice"><strong>Ready to move on when</strong><p>${esc(l.ready)}</p></div><details><summary>What if it isn’t working?</summary><p>${esc(l.fix)}</p></details><div class="clock" id="clock">${clockText()}</div><p id="timerstatus" class="note" style="text-align:center">${timerEnd?'Running while this page is open.':'Optional short session timer'}</p><div class="grid"><button class="soft" onclick="startTimer(${l.time})">Start ${l.time} min</button><button class="outline" onclick="stopTimer()">Reset timer</button></div><div class="grid" style="margin-top:10px"><button onclick="logLesson('Practice went well')">✓ Went well</button><button class="soft" onclick="logLesson('Needs practice')">Needs practice</button></div><p class="note">${good} good sessions · ${not} sessions needing practice</p><button class="wide ${state.done[l.id]?'outline':''}" onclick="toggleDone('${l.id}')">${state.done[l.id]?'✓ Milestone met — reopen':'Mark milestone met'}</button><button class="wide soft" onclick="nextLesson()">Next lesson →</button><p class="note">Mark complete only when the readiness goal is met. You can revisit any skill.</p>`)+section('All lessons · '+lessons[d].length,lessonGroup(d))}function logLesson(k){add(k,selected(state.dog).title)}function nextLesson(){let d=state.dog,i=lessons[d].indexOf(selected(d));state.focus[d]=lessons[d][Math.min(i+1,lessons[d].length-1)].id;save();render();window.scrollTo(0,0)}
function pottyView(){let d=state.dog==='t'?'b':state.dog,log=state.logs.filter(x=>x.dog===d&&pottyKinds.includes(x.kind)),td=log.filter(x=>today(x.time)),last=log.find(x=>x.kind==='Outside pee'||x.kind==='Outside poop');return dogs()+section(esc(name(d))+'’s potty tracker',`<div class="grid">${metric('Outside potty today',td.filter(x=>x.kind==='Outside pee'||x.kind==='Outside poop').length)}${metric('Accidents today',td.filter(x=>x.kind==='Accident').length)}${metric('Independent rings',td.filter(x=>x.kind==='Independent bell').length)}${metric('Last outside potty',last?new Date(last.time).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'—')}</div><p class="muted">Tap what happened immediately after the event. Record the bell and potty separately if both happened.</p><div class="grid">${pottyKinds.map(k=>buttonLog(k,d)).join('')}</div>`,'hero')+section('Potty troubleshooting',`<details><summary>She rings just to go outside</summary><p>Respond promptly. Take a short, boring potty trip on leash or supervised, then come back inside if there is no potty. Play trips can use a different cue.</p></details><details><summary>Accidents or no bell ring</summary><p>Increase scheduled trips and return to prompted bell practice. Clean with enzymatic cleaner. Never punish. Sudden accidents, straining or frequent urination need veterinary advice.</p></details><details><summary>Puppy’s routine</summary><p>Take out after waking, eating, drinking, play and frequently while awake. A young puppy cannot be expected to wait for a bell or hold it for hours.</p></details>`)+section('Recent potty activity',history(log.slice(0,40)))}
function progressView(){let d=state.dog,log=state.logs.filter(x=>x.dog===d),week=log.filter(x=>Date.now()-x.time<7*86400000);return dogs()+section(esc(name(d))+'’s progress',`${progress(d)}<div class="grid" style="margin-top:13px">${metric('Good sessions · 7 days',week.filter(x=>x.kind==='Practice went well').length)}${metric('Practice needed · 7 days',week.filter(x=>x.kind==='Needs practice').length)}${metric('Outside potty · 7 days',week.filter(x=>x.kind==='Outside pee'||x.kind==='Outside poop').length)}${metric('Accidents · 7 days',week.filter(x=>x.kind==='Accident').length)}</div>`,'hero')+section('Milestone review',lessons[d].map(x=>`<div class="item"><input type="checkbox" id="c-${x.id}" ${state.done[x.id]?'checked':''} onchange="toggleDone('${x.id}')"><label for="c-${x.id}"><strong>${esc(x.title)}</strong><small>${esc(x.ready)}</small></label></div>`).join(''))+section('Activity history',history(log.slice(0,60))+'<button class="wide soft" onclick="exportCSV()">Export all activity (CSV)</button>')}
function moreView(){return rewardGuide()+roadmap()+section('Puppy arrival checklist',`<p class="muted">${prep.filter(x=>state.check[x[0]]).length} of ${prep.length} complete</p>${prep.map(([id,title,desc])=>`<div class="item"><input type="checkbox" id="prep-${id}" ${state.check[id]?'checked':''} onchange="toggleCheck('check','${id}')"><label for="prep-${id}"><strong>${esc(title)}</strong><small>${esc(desc)}</small></label></div>`).join('')}`)+section('Supplies checklist',supplies.map((x,i)=>`<div class="item"><input type="checkbox" id="s-${i}" ${state.supply[i]?'checked':''} onchange="toggleCheck('supply','${i}')"><label for="s-${i}">${esc(x)}</label></div>`).join(''))+section('Dog profiles & dates',`<div class="field"><label for="pname">Puppy name</label><input id="pname" maxlength="40" value="${esc(state.name)}" onchange="setField('name',this.value.trim()||'New puppy')"></div><div class="field"><label for="arrival">Expected pickup date</label><input id="arrival" type="date" value="${esc(state.arrival)}" onchange="if(this.value)setField('arrival',this.value)"></div><p class="muted">December 1, 2026 is a placeholder. Change it to the real date. Lessons do not expire.</p><div class="item"><input id="arrived" type="checkbox" ${state.arrived?'checked':''} onchange="setField('arrived',this.checked)"><label for="arrived">Puppy is home</label></div><div class="field"><label for="notes">Family notes</label><textarea id="notes" rows="4" maxlength="5000" onchange="state.notes=this.value;save();notify('Notes saved')">${esc(state.notes)}</textarea></div>`)+section('Install on iPhone',`<p>Open the hosted app in Safari, tap Share, choose Add to Home Screen, then Add. The app works offline after the first successful load when installed from HTTPS.</p><p class="muted">This file by itself is a preview. iOS can restrict file previews and storage. No push notifications are promised; use the Clock or Reminders app for alarms. Data is stored on this device, not synced.</p><button class="wide soft" onclick="exportData()">Save backup</button><div class="field"><label for="import">Restore a backup</label><input id="import" type="file" accept=".json,application/json" onchange="importData(this)"></div><button class="wide danger" onclick="resetApp()">Reset all progress</button>`)+section('Training principles',`<p>Reward good behavior, keep sessions short, and stop if either dog is uncomfortable. No punishment, forced greetings or forced confinement. If Betty has a history of biting, guarding or aggression, consult a qualified reward-based trainer before the puppy arrives.</p><p><a href="https://avsab.org/resources/position-statements/" target="_blank" rel="noopener">AVSAB training & socialization guidance</a></p><p><a href="https://www.akc.org/expert-advice/training/how-to-introduce-dogs/" target="_blank" rel="noopener">AKC dog introduction guidance</a></p><p class="note">Educational training guidance, not veterinary diagnosis. Contact a vet about health concerns.</p>`)}
function download(data,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}function exportData(){download(JSON.stringify(state,null,2),'paw-school-backup.json','application/json')}function exportCSV(){const csv=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download([['Dog','Event','Lesson','Timestamp'].map(csv).join(','),...state.logs.map(x=>[name(x.dog),x.kind,x.lesson,new Date(x.time).toISOString()].map(csv).join(','))].join('\n'),'paw-school-activity.csv','text/csv')}async function importData(el){try{let s=normalize(JSON.parse(await el.files[0].text()));if(confirm('Replace current progress with this backup?')){state=s;save();render();notify('Backup restored')}}catch(e){alert('Could not read this Paw School 2 backup. Your progress was not changed.')}el.value=''}function resetApp(){if(confirm('Permanently clear all profiles, lessons and logs on this device? Export a backup first if needed.')){state=defaults();save();render();notify('Progress reset')}}
function render(){let tab=state.tab;let views={today:todayView,train:trainView,potty:pottyView,progress:progressView,more:moreView};let headings={today:['Good dogs, good days.','Your daily plan for Betty and the little one.'],train:['Training academy','Short, reward-based lessons at your dog’s pace.'],potty:['Potty journal','Every little success counts.'],progress:['Small wins add up.','Review milestones and training history.'],more:['Get puppy-ready.','Your home, profiles and app settings.']};$('headline').textContent=headings[tab][0];$('subtitle').textContent=headings[tab][1];$('nav').innerHTML=[['today','⌂','Today'],['train','♧','Train'],['potty','◉','Potty'],['progress','▥','Progress'],['more','⚙','More']].map(([t,i,n])=>`<button onclick="go('${t}')" class="${t===tab?'active':''}" ${t===tab?'aria-current="page"':''}><b aria-hidden="true">${i}</b>${n}</button>`).join('');$('app').innerHTML=(!storageOK?'<div class="notice">Storage is unavailable. Export a backup before closing this page.</div>':'')+(storageMsg?`<div class="notice">${esc(storageMsg)} <button class="soft" onclick="storageMsg='';render()">Dismiss</button></div>`:'')+views[tab]();updateClock()}save();render();if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></body></html>
